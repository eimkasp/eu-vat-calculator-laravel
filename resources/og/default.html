<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2) format('woff2-variations');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0B1E44;font-family:Inter;color:#fff;font-feature-settings:'cv11','ss03';position:relative;overflow:hidden}
.bar{position:absolute;inset:0 0 auto 0;height:8px;background:#FFCC00}
.wrap{position:absolute;inset:8px 0 0 0;padding:72px 80px 64px;display:grid;grid-template-columns:1fr 330px;gap:48px}
.brand{display:flex;align-items:center;gap:22px;font-size:40px;font-weight:700;letter-spacing:-.02em}
.brand svg{width:72px;height:72px}
h1{margin-top:52px;font-size:60px;line-height:1.06;font-weight:700;letter-spacing:-.035em}
p.sub{margin-top:24px;font-size:28px;line-height:1.35;color:rgba(255,255,255,.78);max-width:640px}
.host{position:absolute;left:80px;bottom:60px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;color:rgba(255,255,255,.72)}
.host i{width:12px;height:12px;background:#FFCC00;display:block}
.tiles{display:grid;gap:14px;align-content:center}
.tile{background:#132B5A;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:20px 24px}
.tile b{display:block;font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:2px;font-size:20px;color:rgba(255,255,255,.72)}
</style></head><body>
<div class="bar"></div>
<div class="wrap">
 <div>
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#fff"/><path d="M10.5 21.5 21.5 10.5" stroke="#0a2a7a" stroke-width="2.75" stroke-linecap="round"/><circle cx="11.25" cy="11.25" r="3.25" fill="#0a2a7a"/><circle cx="20.75" cy="20.75" r="3.25" fill="#ffcc00"/></svg>EU VAT Info</div>
  <h1>EU VAT rates, calculators<br>and VIES checks</h1>
  <p class="sub">Every member state's rates from European Commission data, dated and sourced.</p>
 </div>
 <div class="tiles">
  <div class="tile"><b>27</b><span>EU member states</span></div>
  <div class="tile"><b>24</b><span>EU languages</span></div>
  <div class="tile"><b>Free</b><span>API, dataset and MCP server</span></div>
 </div>
</div>
<div class="host"><i></i>vat.businesspress.io</div>
</body></html>
