# The Xcode project is generated from this file: run `xcodegen` in ios/ after adding or moving files.
name: EUVATInfo

options:
  bundleIdPrefix: io.businesspress
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES

targets:
  EUVATInfo:
    type: application
    platform: iOS
    sources:
      - path: EUVATInfo
    info:
      path: EUVATInfo/Info.plist
      properties:
        CFBundleDisplayName: EU VAT Info
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        SiteURL: $(APP_SITE_URL)
        UILaunchScreen:
          UIColorName: workspace
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: EUVATInfo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  EUVATInfoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EUVATInfoTests
    dependencies:
      - target: EUVATInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  EUVATInfoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EUVATInfoUITests
    dependencies:
      - target: EUVATInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  EUVATInfo:
    build:
      targets:
        EUVATInfo: all
        EUVATInfoTests: [test]
        EUVATInfoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EUVATInfoTests
        - EUVATInfoUITests
    archive:
      config: Release
